[package]
name = "pos"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
webp = "0.3"
blurhash = "0.2.3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
argon2 = { version = "0.5", features = ["std"] }
chrono = "0.4"
tiny_http = "0.12"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
printers = "2.3.0"
base64 = "0.22"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
calamine = "0.38.0"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.

# Optimize dependencies even in dev builds: image decoding/encoding and
# argon2 are many times slower unoptimized (a photo upload took ~6 s).
# Our own crate stays unoptimized for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2
